name: tmp page box check
on:
  push:
    branches: [feat/fb-page-edit]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund --ignore-scripts && npx playwright-core install chromium
      - run: |
          mkdir -p /tmp/d /tmp/o && cp tools/tmpcheck/facebook.json /tmp/d/
          (MULTISTREAM_DATA=/tmp/d PORT=3917 node server.js > /tmp/o/log.txt 2>&1 &)
          sleep 5
          node tools/tmpcheck/shot.js /tmp/o
          for f in /tmp/o/*.png; do echo "IMG $f"; base64 -w 0 $f; echo; echo "END"; done
          tail -5 /tmp/o/log.txt
