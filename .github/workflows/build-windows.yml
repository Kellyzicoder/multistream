name: Build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Build the Windows installer
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep the installer from this run
        uses: actions/upload-artifact@v4
        with:
          name: Multistream-Setup
          path: dist/Multistream-Setup.exe
      - name: Publish a download link (main branch only)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Multistream-Setup.exe --title "Multistream (latest)" --notes "Download Multistream-Setup.exe and run it to install."
        env:
          GH_TOKEN: ${{ github.token }}
