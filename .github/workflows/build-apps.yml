name: Build apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: --win --x64
            files: |
              dist/Multistream2-Setup.exe
              dist/latest.yml
              dist/Multistream2-Setup.exe.blockmap
          - os: macos-latest
            name: Mac
            args: --mac --x64 --arm64
            files: dist/Multistream2-Mac-*.dmg
          - os: ubuntu-latest
            name: Linux
            args: --linux --x64
            files: dist/Multistream2-Linux.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Number this build (2.0.<run number>) so apps can tell which is newer
        shell: bash
        run: npm version "2.0.${{ github.run_number }}" --no-git-tag-version
      # Windows only: build the free "softcam" virtual camera (MIT licence) and our small helper that feeds it
      - name: Get softcam source
        if: matrix.name == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: tshino/softcam
          ref: 6f5d8f9b5f7dc37a86a119b881bc75e1860fb3ec
          path: softcam-src
      - name: Add MSBuild
        if: matrix.name == 'Windows'
        uses: microsoft/setup-msbuild@v2
      - name: Add the C++ compiler to the path
        if: matrix.name == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build the virtual camera
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          Push-Location softcam-src
          nuget restore softcam.sln
          msbuild /m /p:Configuration=Release /p:Platform=x64 softcam.sln
          msbuild /m /p:Configuration=Release /p:Platform=x64 examples/softcam_installer/softcam_installer.sln
          Pop-Location
          New-Item -ItemType Directory -Force vcam/win | Out-Null
          Copy-Item softcam-src/dist/bin/x64/softcam.dll vcam/win/
          $inst = Get-ChildItem -Recurse softcam-src/examples/softcam_installer -Filter softcam_installer.exe | Select-Object -First 1
          Copy-Item $inst.FullName vcam/win/
          Copy-Item softcam-src/LICENSE vcam/win/softcam-LICENSE.txt
          cl /nologo /O2 /EHsc /Isoftcam-src\dist\include vcam\vcam.cpp /Fe:vcam\win\vcam.exe /link softcam-src\dist\lib\x64\softcam.lib user32.lib
          Get-ChildItem vcam/win
      - name: Install
        run: npm install
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Keep the installer from this run
        uses: actions/upload-artifact@v4
        with:
          name: Multistream2-${{ matrix.name }}
          path: ${{ matrix.files }}

  release:
    if: github.ref == 'refs/heads/v2'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish a download link
        run: |
          echo '{"version":"2.0.${{ github.run_number }}"}' > out/version.json
          ls -l out
          gh release delete v2-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create v2-latest out/* --repo "$GITHUB_REPOSITORY" --latest=false --title "Multistream 2 (latest)" --notes "Version 2 (test). Windows: Multistream2-Setup.exe. Mac: Multistream2-Mac-arm64.dmg (M1 and newer) or Multistream2-Mac-x64.dmg (Intel). Linux: Multistream2-Linux.AppImage. Version 1 stays on the Multistream (latest) release."
        env:
          GH_TOKEN: ${{ github.token }}
