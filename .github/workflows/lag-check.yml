name: Click speed check
# Opens the real app on Mac and Windows and measures how quickly it answers clicks right after opening
# (Studio <-> Go Live), with and without the OBS engine. It changes nothing in the app.
on:
  workflow_dispatch:
  push:
    branches: [feat/engine-always-on]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
        engine: [on, off]
        try: [1]
        include:
          - { os: macos-latest, engine: on, try: 2 }
          - { os: macos-latest, engine: on, try: 3 }
          - { os: macos-latest, engine: on, try: 4 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the app
        run: npm install --no-audit --no-fund
      - name: Get the OBS engine
        shell: bash
        run: bash scripts/get-obs-engine.sh
      - name: Measure clicks right after the app opens
        shell: bash
        env:
          MULTISTREAM_ENGINE: ${{ matrix.engine }}
          MULTISTREAM_ENGINE_LOG: '1'
        run: |
          # Mac: if the app stops answering, write down what each of its parts is doing (to find a freeze)
          if [ "$RUNNER_OS" = "macOS" ]; then
            ( sleep 100; if ! grep -q "time each click" lag.txt 2>/dev/null; then
                echo "[lag] the app seems stuck; what it is doing:" >> stuck.txt
                ps -axo pid,ppid,stat,command | grep -E "Electron|obs64" | grep -v grep | cut -c1-160 >> stuck.txt; for p in $(pgrep -f "MacOS/Electron .*multistream$|bin/obs64"); do echo "==== $p $(ps -o command= -p $p | cut -c1-150)" >> stuck.txt; sample $p 1 -mayDie -file /tmp/s.txt >/dev/null 2>&1; grep -v "fontations\|font_types\|read_fonts\|skrifa" /tmp/s.txt | grep -A45 "DispatchQueue_1: com.apple.main-thread" | head -60 >> stuck.txt; done
                cat stuck.txt
              fi ) &
          fi
          node tools/click-lag-test.js 2>&1 | tee lag.txt
          sleep 1; if [ -f stuck.txt ]; then cat stuck.txt; fi
        timeout-minutes: 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lag-${{ matrix.os }}-engine-${{ matrix.engine }}-${{ matrix.try }}
          path: |
            lag.txt
            lag-trace.json
            lag-start.png
            stuck.txt
